<title>小八架构拓扑</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working screen — toolbar on top, schematic canvas left, inspector right (bottom sheet on phones). */
:root{
  --bg:#ECEFEA; --surface:#FAFBF8; --panel:#F3F5F1; --ink:#1C2420; --muted:#5D6862; --line:#C9D1CA; --grid:#D3DAD3;
  --accent:#2C5A86; --accent-ink:#FFFFFF;
  --s-done:#2E7A4E; --s-dev:#2C5A86; --s-todo:#A86F12; --s-old:#858C88; --s-decide:#9C3468; --issue:#B83A2E;
  --edge:#55615A; --sel:#2C5A86;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121715; --surface:#1B221F; --panel:#171D1A; --ink:#E2E9E4; --muted:#98A49D; --line:#34403A; --grid:#26302B;
  --accent:#7FB0DE; --accent-ink:#0E1A26;
  --s-done:#6CC08E; --s-dev:#7FB0DE; --s-todo:#E0A84A; --s-old:#8E9692; --s-decide:#E07AAE; --issue:#F07F72;
  --edge:#9AA7A0; --sel:#7FB0DE; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1B221F; --panel:#171D1A; --ink:#E2E9E4; --muted:#98A49D; --line:#34403A; --grid:#26302B;
  --accent:#7FB0DE; --accent-ink:#0E1A26;
  --s-done:#6CC08E; --s-dev:#7FB0DE; --s-todo:#E0A84A; --s-old:#8E9692; --s-decide:#E07AAE; --issue:#F07F72;
  --edge:#9AA7A0; --sel:#7FB0DE; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 12px;gap:10px;box-sizing:border-box}
[hidden]{display:none!important}
header.bar{display:flex;flex-wrap:nowrap;align-items:center;gap:8px;padding-block:10px 4px;overflow-x:auto;scrollbar-width:thin}
header.bar>*{flex-shrink:0}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:6px}
.brand h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.02em}
.brand .ver{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.grp{display:flex;gap:4px;align-items:center}
.sep{width:1px;height:22px;background:var(--line)}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:5px 10px;cursor:pointer;line-height:1.3;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.chipf:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--issue);border-color:color-mix(in srgb,var(--issue) 45%,var(--line))}
.btn.armed{background:var(--issue);color:var(--surface);border-color:var(--issue)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.search{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:5px 8px;width:150px}
.save{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-left:auto}
.save i{width:8px;height:8px;border-radius:50%;background:var(--s-old);display:inline-block}
.save.ok i{background:var(--s-done)} .save.busy i{background:var(--s-todo)} .save.warn i{background:var(--issue)}
.main{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:10px;min-height:0}
#stage{position:relative;overflow:hidden;touch-action:none;border:1px solid var(--line);border-radius:8px;background-color:var(--bg);
  background-image:radial-gradient(var(--grid) 1.2px,transparent 1.3px);cursor:grab;user-select:none;-webkit-user-select:none}
#stage.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#frames,#labels,#nodes{position:absolute;left:0;top:0}
#edges{position:absolute;left:0;top:0;overflow:visible;width:1px;height:1px}
.frame{position:absolute;border:1px dashed var(--line);border-radius:10px;background:color-mix(in srgb,var(--surface) 35%,transparent)}
.frame.selected{border-color:var(--sel);border-style:solid}
.fhead{position:absolute;left:10px;top:-13px;display:flex;align-items:center;gap:6px;background:var(--bg);padding:1px 8px;border:1px solid var(--line);border-radius:4px;cursor:move;font-size:12.5px;font-weight:500;white-space:nowrap}
.fhead .cnt{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.mini{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:13px;padding:0 3px;line-height:1}
.mini:hover{color:var(--ink)}
.node{position:absolute;width:196px;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px 8px;cursor:pointer;box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 8%,transparent)}
.node.st-old{border-style:dashed;background:var(--panel)}
.node.st-todo{border-style:dashed;border-color:color-mix(in srgb,var(--s-todo) 60%,var(--line))}
.node.st-decide{border-color:var(--s-decide);box-shadow:0 0 0 2px color-mix(in srgb,var(--s-decide) 22%,transparent)}
.node.selected{border-color:var(--sel);box-shadow:0 0 0 2px var(--sel)}
.node.src{box-shadow:0 0 0 3px var(--s-todo)}
.node.dim,.pill.dim{opacity:.22}
.ntop{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;letter-spacing:.04em;color:var(--muted)}
.chip::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--c,var(--s-old))}
.iss{font-family:var(--f-mono);font-size:10.5px;color:var(--surface);background:var(--issue);border-radius:8px;padding:0 6px;line-height:15px}
.ntop .mini{margin-left:auto}
.pend{font-size:10.5px;color:var(--s-decide);border:1px solid var(--s-decide);border-radius:8px;padding:0 6px;line-height:15px}
.draft{font-size:10.5px;color:var(--s-todo);border:1px dashed var(--s-todo);border-radius:8px;padding:0 6px;line-height:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.primary:disabled{background:var(--surface);color:var(--muted);border-color:var(--line)}
.notebox{border:1.5px solid var(--s-todo);background:color-mix(in srgb,var(--s-todo) 7%,var(--surface));border-radius:7px;padding:10px;display:grid;gap:6px}
.notebox textarea{min-height:84px}
.hist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.hist li{border-left:3px solid var(--c,var(--line));padding:4px 0 4px 9px;font-size:12.5px;line-height:1.5;display:grid;gap:2px}
.hist .who{font-size:10.5px;letter-spacing:.04em;color:var(--muted);font-family:var(--f-mono)}
.hist details summary{cursor:pointer;color:var(--muted);font-size:11.5px}
.hist pre{white-space:pre-wrap;font-family:var(--f-mono);font-size:11px;margin:4px 0 0;color:var(--muted)}
.subm{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;display:grid;gap:5px;font-size:12.5px;line-height:1.5}
.subm .st{font-size:11px;font-weight:700}
.subm .st.pending{color:var(--s-decide)} .subm .st.done{color:var(--s-done)}
.subm ul{margin:0;padding-left:18px}
.ntitle{font-weight:700;font-size:13.5px;line-height:1.35;text-wrap:balance}
.nsub{font-size:12px;color:var(--muted);line-height:1.4;margin-top:2px}
.ndet{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-size:12px;line-height:1.5;display:grid;gap:5px}
.ndet .k{font-size:10.5px;letter-spacing:.06em;color:var(--muted)}
.ndet ul{margin:0;padding-left:16px}
.ndet .ref{font-family:var(--f-mono);font-size:11px;word-break:break-all}
.ndet .issue{color:var(--issue)}
.port{position:absolute;right:-7px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);cursor:crosshair;box-sizing:border-box}
.node:hover .port,.node.selected .port{background:var(--accent)}
.pill{position:absolute;min-width:180px;box-sizing:border-box;background:var(--panel);border:1.5px solid var(--muted);border-radius:18px;padding:7px 12px;cursor:move;display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.pill .cnt{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:400}
.pill.selected{border-color:var(--sel)}
#edges path.e{fill:none;stroke:var(--edge);stroke-width:1.4}
#edges path.e.k-old{stroke:var(--s-old);stroke-dasharray:6 5}
#edges path.e.k-pending{stroke:var(--s-todo);stroke-dasharray:3 4;stroke-width:1.6}
#edges path.e.sel{stroke:var(--sel);stroke-width:2.6}
#edges path.e.dim{opacity:.18}
#edges path.hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer;pointer-events:stroke}
#edges path.tmp{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-dasharray:4 3}
.elabel{position:absolute;transform:translate(-50%,-50%);font-size:11px;color:var(--muted);background:var(--bg);padding:0 4px;border-radius:3px;white-space:nowrap;cursor:pointer;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.elabel.sel{color:var(--sel);font-weight:500}
.elabel.dim{opacity:.2}
.zoomer{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px}
.zoomer .btn{padding:3px 0;width:34px;text-align:center}
.hint{position:absolute;left:10px;bottom:10px;font-size:11.5px;color:var(--muted);background:color-mix(in srgb,var(--bg) 85%,transparent);padding:3px 8px;border-radius:4px;max-width:calc(100% - 80px)}
.banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--s-todo);border-radius:6px;padding:8px 12px;font-size:12.5px;max-width:calc(100% - 40px);box-shadow:0 4px 14px color-mix(in srgb,var(--ink) 12%,transparent)}
aside{min-width:0;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;white-space:nowrap;border:0;background:transparent;padding:9px 8px;cursor:pointer;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.sheet-toggle{display:none}
.pbody{overflow:auto;padding:12px 14px 18px;display:grid;gap:12px;align-content:start;min-height:0}
.pbody h3{margin:0;font-size:15px;text-wrap:balance}
.pbody h4{margin:4px 0 0;font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.eyebrow{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.pbody label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.pbody input,.pbody select,.pbody textarea{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:6px 8px;color:var(--ink);font-size:13px;min-width:0}
.pbody textarea{resize:vertical;min-height:64px;line-height:1.5}
.pbody textarea.mono{font-family:var(--f-mono);font-size:11.5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.list{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.list li{display:flex;align-items:center;gap:6px;font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:5px 8px;min-width:0}
.list li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.list li .t:hover{text-decoration:underline}
.list li .dir{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.chipf{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:5px 8px;cursor:pointer;font-size:12.5px;text-align:left}
.chipf::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--c)}
.chipf b{margin-left:auto;font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.chipf.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.log li{display:grid;gap:2px;align-items:start}
.log .when{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.log .op{font-size:11px;font-weight:700}
.op-add{color:var(--s-done)} .op-del{color:var(--issue)} .op-edit{color:var(--s-dev)} .op-link{color:var(--s-todo)}
.note{font-size:12px;color:var(--muted);line-height:1.55}
.warn{font-size:12px;color:var(--issue)}
pre.reader{white-space:pre-wrap;word-break:break-word;font-family:var(--f-mono);font-size:11.5px;line-height:1.55;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:10px;margin:0;max-height:none}
code{font-family:var(--f-mono);font-size:11.5px}
#board{position:absolute;inset:0;z-index:4;background:var(--bg);border-radius:8px;display:grid;grid-template-rows:auto auto 1fr;min-height:0}
.bhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px 6px}
.bhead h2{margin:0;font-size:16px}
.bhead .note{margin-right:auto}
.days{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 10px;border-bottom:1px solid var(--line)}
.day{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:5px 10px;cursor:pointer;font-size:12.5px;display:flex;gap:6px;align-items:baseline}
.day b{font-family:var(--f-mono);font-weight:500;font-size:11px;color:var(--muted)}
.day.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cols{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:10px;padding:12px 14px;overflow:auto;min-height:0}
.col{display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px}
.col h3{margin:0 0 2px;font-size:12.5px;display:flex;align-items:center;gap:6px}
.col h3::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--c)}
.col h3 b{margin-left:auto;font-family:var(--f-mono);font-weight:500;font-size:11px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:7px 9px;display:grid;gap:4px;font-size:12.5px;line-height:1.5}
.card .when{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.card .acts{display:flex;gap:6px;flex-wrap:wrap}
.card .acts button{font-size:11.5px;padding:2px 8px}
.dayhead{font-size:11px;letter-spacing:.06em;color:var(--muted);margin-top:4px}
@media (max-width:760px){.cols{grid-template-columns:repeat(5,minmax(200px,80vw))}}
@media (max-width:760px){
  .main{grid-template-columns:minmax(0,1fr)}
  aside{position:absolute;left:0;right:0;bottom:0;height:52%;z-index:5;transition:transform .2s ease;box-shadow:0 -6px 18px color-mix(in srgb,var(--ink) 14%,transparent)}
  aside.closed{transform:translateY(calc(100% - 40px))}
  .sheet-toggle{display:block;flex:0 0 auto !important;padding:9px 12px !important}
  .search{width:110px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
</style>

<div class="app">
  <header class="bar">
    <div class="brand"><h1>小八架构拓扑</h1><span class="ver" id="verTag">基线 2026-10-27</span></div>
    <div class="grp">
      <button class="btn" id="bAddNode" type="button">＋ 节点</button>
      <button class="btn" id="bAddGroup" type="button">＋ 分组</button>
      <button class="btn" id="bConnect" type="button" title="依次点两个节点连线">连线模式</button>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <button class="btn" id="bUndo" type="button" title="Ctrl/⌘+Z">撤销</button>
      <button class="btn" id="bRedo" type="button" title="Ctrl/⌘+Shift+Z">重做</button>
      <button class="btn" id="bFit" type="button">适应画面</button>
      <button class="btn" id="bExpandAll" type="button">展开全部详情</button>
      <button class="btn" id="bBoard" type="button">历史看板</button>
    </div>
    <span class="sep"></span>
    <input class="search" id="q" type="search" placeholder="搜索节点，回车定位" aria-label="搜索节点">
    <button class="btn primary" id="bSubmit" type="button" title="把各节点上的大白话想法和这段时间的增删改一起提交给 Agent 整理">提交本轮修改</button>
    <div class="save" id="saveState"><i></i><span>连接保存中…</span></div>
  </header>
  <div class="main">
    <div id="stage" aria-label="小八架构拓扑画布">
      <div id="world">
        <div id="frames"></div>
        <svg id="edges"><defs>
          <marker id="ar-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--edge)"/></marker>
          <marker id="ar-old" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--s-old)"/></marker>
          <marker id="ar-pending" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--s-todo)"/></marker>
          <marker id="ar-sel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--sel)"/></marker>
        </defs><g id="eg"></g><path class="tmp" id="tmp" d="" /></svg>
        <div id="labels"></div>
        <div id="nodes"></div>
      </div>
      <div class="banner" id="banner" hidden></div>
      <div class="hint" id="hint">拖动节点移动 · 从节点右侧圆点拖到另一节点即连线 · 点连线后可断开 · 拖空白处平移，滚轮缩放</div>
      <section id="board" hidden aria-label="历史看板">
        <div class="bhead"><h2>历史看板</h2><span class="note" id="bSum"></span><button class="btn" type="button" id="bCloseBoard">回到拓扑图</button></div>
        <div class="days" id="days"></div>
        <div class="cols" id="cols"></div>
      </section>
      <div class="zoomer"><button class="btn" id="zIn" type="button" aria-label="放大">＋</button><button class="btn" id="zOut" type="button" aria-label="缩小">−</button></div>
    </div>
    <aside id="aside">
      <div class="tabs" role="tablist">
        <button class="sheet-toggle" id="sheetToggle" type="button" aria-label="收起或展开面板">▾</button>
        <button type="button" data-tab="inspect" class="on">检视</button>
        <button type="button" data-tab="overview">总览</button>
        <button type="button" data-tab="submits">提交</button>
        <button type="button" data-tab="log">变更记录</button>
        <button type="button" data-tab="reader">Agent 读本</button>
      </div>
      <div class="pbody" id="pbody"></div>
    </aside>
  </div>
</div>

<script>
(function(){
"use strict";
/* ---------- 基线：2026-10-27 设计图 + 2026-10-29 核对标注 ---------- */
const BASE = {version:1,
groups:[
 {id:"g1",title:"一、接入、路由与任务执行",collapsed:false,x:40,y:40},
 {id:"g2",title:"二、交付、候选与真实任务应用",collapsed:false,x:40,y:560},
 {id:"g3",title:"三、经验核验状态机",collapsed:false,x:40,y:1000},
 {id:"g4",title:"四、独立审查接入",collapsed:false,x:40,y:1470},
 {id:"g5",title:"五、共享底座与贯穿治理",collapsed:false,x:40,y:1760}

      b={x:x1-26,y:y1-30,w:x2-x1+52,h:y2-y1+56};}
    else b={x:g.x,y:g.y,w:260,h:120};

function anchor(a,b){
  const ac={x:a.x+a.w/2,y:a.y+a.h/2},bc={x:b.x+b.w/2,y:b.y+b.h/2},dx=bc.x-ac.x,dy=bc.y-ac.y;

  const s=Math.sign(dy)||1;return [{x:ac.x,y:s>0?a.y+a.h:a.y},{x:bc.x,y:s>0?b.y:b.y+b.h},"v",s];

function pathFor(p,q,dir,s){

  const t=.5,mt=1-t,mx=mt*mt*mt*p.x+3*mt*mt*t*c1.x+3*mt*t*t*c2.x+t*t*t*q.x,my=mt*mt*mt*p.y+3*mt*mt*t*c1.y+3*mt*t*t*c2.y+t*t*t*q.y;
  return {d:`M${p.x} ${p.y}C${c1.x} ${c1.y} ${c2.x} ${c2.y} ${q.x} ${q.y}`,mx,my};

function drawEdges(){
  let ph="",lh="";const seen=new Set();

    const a=endOf(e.from),b=endOf(e.to);if(!a||!b||a===b)return;
    const key=a+">"+b+">"+e.kind;if((a.startsWith("G:")||b.startsWith("G:"))&&seen.has(key))return;seen.add(key);
    const [p,q,dir,s]=anchor(rectOf(a),rectOf(b));const P=pathFor(p,q,dir,s);

    const na=node(e.from),nb=node(e.to);const dim=filtering()&&!(na&&matches(na)||nb&&matches(nb));

    if(e.label)lh+=`<div class="elabel${isSel?" sel":""}${dim?" dim":""}" data-elabel="${esc(e.id)}" style="left:${P.mx}px;top:${P.my}px" title="${esc(e.label)}">${esc(e.label)}</div>`;

/* ---------- 变更、撤销、保存 ---------- */
function commit(fn,entry){
  if(!editable())return false;
  undoS.push(JSON.stringify(G));if(undoS.length>80)undoS.shift();redoS=[];
  fn();render();scheduleSave();if(entry)writeLog(entry);return true;
}
function undo(){if(!undoS.length||!editable())return;redoS.push(JSON.stringify(G));G=JSON.parse(undoS.pop());fixSel();render();scheduleSave();writeLog({op:"edit",text:"撤销了上一步"});}
function redo(){if(!redoS.length||!editable())return;undoS.push(JSON.stringify(G));G=JSON.parse(redoS.pop());fixSel();render();scheduleSave();writeLog({op:"edit",text:"重做了一步"});}
function fixSel(){if(!sel)return;if(sel.type==="node"&&!node(sel.id)||sel.type==="edge"&&!G.edges.find(e=>e.id===sel.id)||sel.type==="group"&&!group(sel.id))sel=null;}
function setSave(cls,text){const el=$("#saveState");el.className="save "+cls;el.querySelector("span").textContent=text;}
let saveT=null,saving=false,again=false,lastSaved="";
function scheduleSave(){clearTimeout(saveT);setSave("busy","有未保存的修改");saveT=setTimeout(doSave,600);}
async function doSave(){
  const body=JSON.stringify(G);
  if(mode==="local"){try{localStorage.setItem("xb-topology-v1",body);setSave("warn","只存在本浏览器");}catch(_){setSave("warn","本浏览器也存不下，请导出");}return;}
  if(mode!=="db")return;
  if(saving){again=true;return;}
  saving=true;setSave("busy","保存中…");
  try{await docRef.set(Object.assign(JSON.parse(body),{savedAt:Date.now()}));lastSaved=body;setSave("ok","已保存 "+clock(Date.now()));}
  catch(err){setSave("warn",err&&err.code==="quota_exceeded"?"存储已满，请导出备份后清理":"保存失败："+(err&&err.code||"未知")+"，修改仍在本页");}
  saving=false;if(again){again=false;doSave();}
}
function writeLog(entry){
  const rec={at:Date.now(),day:dayOf(Date.now()),op:entry.op,text:entry.text,target:entry.target||"",before:entry.before?JSON.stringify(entry.before):""};
  if(mode==="db"&&logCol){logCol.add(rec).catch(()=>{});}
  else{logs.unshift(Object.assign({id:uid("l")},rec));logs=logs.slice(0,1000);try{localStorage.setItem("xb-topology-log",JSON.stringify(logs));}catch(_){} if(tab==="log")renderPanel();renderBoard();}
}
const pad=n=>String(n).padStart(2,"0");

function addNode(){

function connect(a,b){
  if(a.startsWith("G:")||b.startsWith("G:")){flash("请先展开分组，再连到具体节点");return;}
  if(a===b)return;
  const ex=G.edges.find(e=>e.from===a&&e.to===b);
  if(ex){sel={type:"edge",id:ex.id};tab="inspect";render();flash("这两个节点之间已经有同方向的连线");return;}
  const e={id:uid("e"),from:a,to:b,label:"",kind:"normal"};
  commit(()=>{G.edges.push(e);sel={type:"edge",id:e.id};tab="inspect";},{op:"link",target:a,text:`接入：「${nameOf(a)}」→「${nameOf(b)}」`});
}
function deleteEdge(id){const e=G.edges.find(x=>x.id===id);if(!e)return;
  commit(()=>{G.edges=G.edges.filter(x=>x.id!==id);if(sel&&sel.id===id)sel=null;},{op:"unlink",target:e.from,text:`断开：「${nameOf(e.from)}」→「${nameOf(e.to)}」${e.label?"（"+e.label+"）":""}`,before:e});}

    {op:"del",text:`删除节点「${n.title}」，连带断开 ${es.length} 条连线`,before:{node:n,edges:es}});}

  commit(()=>{G.nodes.forEach(n=>{if(n.g===id)n.g="";});G.groups=G.groups.filter(x=>x.id!==id);sel=null;},
    {op:"del",text:`删除分组「${g.title}」，其中 ${ms.length} 个节点改为未分组`,before:{group:g,members:ms}});}
function restore(l){
  let b;try{b=JSON.parse(l.before||"null");}catch(_){b=null;}if(!b)return;

    const back=(b.edges||[]).filter(e=>!G.edges.find(x=>x.id===e.id)&&(e.from===b.node.id||node(e.from))&&(e.to===b.node.id||node(e.to)));
    commit(()=>{const n=clone(b.node);if(n.g&&!group(n.g))n.g="";G.nodes.push(n);G.edges.push(...clone(back));sel={type:"node",id:n.id};},{op:"add",target:b.node.id,text:`恢复已删除的节点「${b.node.title}」及 ${back.length} 条连线`});
    closeBoard();focusNode(b.node.id);}
  else if(b.group){if(group(b.group.id)){flash("这个分组已经在图上了");return;}
    commit(()=>{G.groups.push(clone(b.group));(b.members||[]).forEach(id=>{const n=node(id);if(n&&!n.g)n.g=b.group.id;});},{op:"add",text:`恢复已删除的分组「${b.group.title}」`});closeBoard();}

    commit(()=>{G.edges.push(clone(b));},{op:"link",target:b.from,text:`恢复连线「${nameOf(b.from)}」→「${nameOf(b.to)}」`});closeBoard();}
}

/* ---------- 画布交互 ---------- */
function toWorld(cx,cy){const r=stage.getBoundingClientRect();return {x:(cx-r.left-view.x)/view.k,y:(cy-r.top-view.y)/view.k};}
stage.addEventListener("pointerdown",e=>{
  if(e.button!==0&&e.pointerType==="mouse")return;
  if(e.target.closest("[data-exp],[data-gcol],.zoomer,.banner"))return;
  const port=e.target.closest("[data-port]"),nodeEl=e.target.closest("[data-node]"),pill=e.target.closest("[data-gpill]"),gh=e.target.closest("[data-ghead]"),edge=e.target.closest("[data-edge],[data-elabel]");

  if(port&&editable()&&!port.dataset.port.startsWith("G:")){drag=Object.assign(base,{type:"link",from:port.dataset.port});}
  else if(nodeEl){const n=node(nodeEl.dataset.node);drag=Object.assign(base,{type:"node",id:n.id,ox:n.x,oy:n.y,before:JSON.stringify(G),el:nodeEl});}
  else if(pill||gh){const gid=(pill||gh).dataset.gpill||(pill||gh).dataset.ghead;const g=group(gid);
    drag=Object.assign(base,{type:"group",id:gid,gx:g.x,gy:g.y,ms:G.nodes.filter(n=>n.g===gid).map(n=>[n,n.x,n.y]),before:JSON.stringify(G)});}
  else if(edge){const id=edge.dataset.edge||edge.dataset.elabel;sel={type:"edge",id};tab="inspect";render();openSheet();return;}
  else{drag=Object.assign(base,{type:"pan",vx:view.x,vy:view.y});stage.classList.add("panning");}

  else if(drag.type==="node"){if(!editable())return;const n=node(drag.id);n.x=Math.round(drag.ox+dx/view.k);n.y=Math.round(drag.oy+dy/view.k);drag.el.style.transform=`translate(${n.x}px,${n.y}px)`;refreshGeometry();}
  else if(drag.type==="group"){if(!editable())return;const g=group(drag.id),ddx=dx/view.k,ddy=dy/view.k;g.x=Math.round(drag.gx+ddx);g.y=Math.round(drag.gy+ddy);
    drag.ms.forEach(([n,x,y])=>{n.x=Math.round(x+ddx);n.y=Math.round(y+ddy);const el=nodesEl.querySelector(`[data-node="${CSS.escape(n.id)}"]`);if(el)el.style.transform=`translate(${n.x}px,${n.y}px)`;});
    const pe=nodesEl.querySelector(`[data-gpill="${CSS.escape(g.id)}"]`);if(pe)pe.style.transform=`translate(${g.x}px,${g.y}px)`;refreshGeometry();}

function endDrag(e){

  if(e.ctrlKey||Math.abs(e.deltaY)>=Math.abs(e.deltaX)){zoomAt(px,py,Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0016)));}

function zoomAt(px,py,f){const k=Math.min(2,Math.max(.15,view.k*f));view.x=px-(px-view.x)*k/view.k;view.y=py-(py-view.y)*k/view.k;view.k=k;applyView();}

$("#zOut").onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1/1.2);};
function fit(ids){
  const rs=(ids||G.nodes.filter(n=>!collapsed(n.g)).map(n=>n.id).concat(G.groups.filter(g=>g.collapsed).map(g=>"G:"+g.id))).map(rectOf);
  if(!rs.length)return;let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;rs.forEach(r=>{x1=Math.min(x1,r.x);y1=Math.min(y1,r.y);x2=Math.max(x2,r.x+r.w);y2=Math.max(y2,r.y+r.h);});
  const s=stage.getBoundingClientRect(),k=Math.min(1.1,Math.max(.15,Math.min((s.width-60)/(x2-x1+60),(s.height-60)/(y2-y1+60))));
  view.k=k;view.x=(s.width-(x2-x1)*k)/2-x1*k;view.y=(s.height-(y2-y1)*k)/2-y1*k;applyView();

  const s=stage.getBoundingClientRect(),r=rectOf(id);view.k=Math.max(view.k,.85);view.x=s.width/2-(r.x+r.w/2)*view.k;view.y=s.height/2-(r.y+r.h/2)*view.k;applyView();openSheet();}

function updateButtons(){

  sb.disabled=!editable()||!(dc||cc);sb.textContent=dc||cc?`提交本轮修改（${dc+cc}）`:"提交本轮修改";

document.addEventListener("keydown",e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement&&document.activeElement.tagName);
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="z"&&!typing){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(typing)return;
  if(e.key==="Escape"){connectMode=false;connectFrom=null;sel=null;render();}
  if((e.key==="Delete"||e.key==="Backspace")&&sel&&editable()){
    if(sel.type==="edge"){e.preventDefault();deleteEdge(sel.id);}
    else if(sel.type==="node"){e.preventDefault();armDelete("node:"+sel.id);}
  }
});

const aside=$("#aside");

function armDelete(key){armedDelete=key;tab="inspect";renderPanel();openSheet();}
function opts(map,cur){return Object.entries(map).map(([k,v])=>`<option value="${esc(k)}"${k===cur?" selected":""}>${esc(Array.isArray(v)?v[0]:v)}</option>`).join("");}
function renderPanel(){
  document.querySelectorAll(".tabs [data-tab]").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  if(tab==="overview")return panelOverview();
  if(tab==="log")return panelLog();
  if(tab==="submits")return panelSubmits();
  if(tab==="reader")return panelReader();
  if(!sel)return panelEmpty();
  if(sel.type==="node")return panelNode(node(sel.id));
  if(sel.type==="edge")return panelEdge(G.edges.find(e=>e.id===sel.id));
  if(sel.type==="group")return panelGroup(group(sel.id));
}

function connList(n){
  const out=G.edges.filter(e=>e.from===n.id),inn=G.edges.filter(e=>e.to===n.id);
  const li=(e,dir,other)=>`<li><span class="dir">${dir}</span><span class="t" data-go="${esc(other)}">${esc(nameOf(other))}${e.label?" · "+esc(e.label):""}</span><button class="mini" type="button" data-sel-edge="${esc(e.id)}" title="选中这条连线">✎</button><button class="mini" type="button" data-cut="${esc(e.id)}" title="断开" aria-label="断开">✕</button></li>`;
  return out.length||inn.length?`<ul class="list">${out.map(e=>li(e,"出 →",e.to)).join("")}${inn.map(e=>li(e,"← 入",e.from)).join("")}</ul>`:'<p class="note">还没有连线。从节点右侧圆点拖到别的节点即可接入。</p>';
}

function refreshNodeCard(n){const el=nodesEl.querySelector(`[data-node="${CSS.escape(n.id)}"]`);if(!el)return;const tmpd=document.createElement("div");tmpd.innerHTML=nodeHTML(n);el.replaceWith(tmpd.firstElementChild);}
const FIELD_NAMES={title:"名称",sub:"一句话说明",status:"状态",intent:"用户意图",desc:"详细说明",refs:"位置",issues:"问题与待办"};
function nodeHistory(n){
  const own=(n.history||[]).map(h=>Object.assign({src:"h"},h));
  const fromLog=logs.filter(l=>l.target===n.id&&l.op!=="submit"&&l.op!=="agent").map(l=>({src:"l",at:l.at,by:"log",text:l.text,op:l.op}));
  const all=own.concat(fromLog).sort((a,b)=>b.at-a.at);
  if(!all.length)return '<p class="note">还没有历史。写下想法并提交后，原话会出现在这里。</p>';
  return `<ul class="hist">${all.map(h=>{
    if(h.by==="user")return `<li style="--c:var(--s-todo)"><span class="who">${esc(stamp(h.at))} · 你的原话（已提交）</span><span>${esc(h.text)}</span></li>`;
    if(h.by==="agent"){const b=h.before?Object.entries(h.before).map(([k,v])=>`${FIELD_NAMES[k]||k}：${v}`).join("\n"):"";
      return `<li style="--c:var(--s-dev)"><span class="who">${esc(stamp(h.at))} · ${esc(h.agent||"Agent")} 整理</span><span>${esc(h.text)}</span>${b?`<details><summary>整理前的描述</summary><pre>${esc(b)}</pre></details>`:""}</li>`;}
    return `<li style="--c:var(--line)"><span class="who">${esc(stamp(h.at))} · ${esc((OPS[h.op]||OPS.edit)[0])}</span><span>${esc(h.text)}</span></li>`;
  }).join("")}</ul>`;
}
let submissions=[],subCol=null;
function draftCount(){return G.nodes.filter(n=>n.note&&n.note.trim()).length;}
function changesSinceSubmit(){return logs.filter(l=>l.at>(G.lastSubmitAt||0)&&l.op!=="submit"&&l.op!=="agent").slice().reverse();}
let submitArmed=false;
function submitRound(){
  if(!editable())return;
  const notes=G.nodes.filter(n=>n.note&&n.note.trim()).map(n=>({node:n.id,title:n.title,text:n.note.trim()}));
  const changes=changesSinceSubmit().map(l=>({at:l.at,op:l.op,text:l.text,target:l.target||""}));
  if(!notes.length&&!changes.length){flash("还没有新的想法或改动可以提交");return;}
  const at=Date.now(),id="s"+at;
  const sub={at,day:dayOf(at),status:"pending",notes,changes,result:"",doneAt:0,agent:""};
  commit(()=>{G.nodes.forEach(n=>{if(n.note&&n.note.trim()){n.history.push({at,by:"user",text:n.note.trim(),submission:id});n.note="";n.pending=true;}});G.lastSubmitAt=at;},
    {op:"submit",text:`提交本轮修改：${notes.length} 个节点写了想法，期间 ${changes.length} 项增删改，等 Agent 整理`,target:""});
  if(mode==="db"&&subCol){subCol.doc(id).set(sub).catch(()=>flash("提交记录没存上，请稍后再点一次提交"));}
  else{submissions.unshift(Object.assign({id},sub));try{localStorage.setItem("xb-topology-subs",JSON.stringify(submissions));}catch(_){} }
  tab="submits";renderPanel();openSheet();
}

  $("#b-sub2").onclick=submitRound;bindLists();

function readerText(){
  const gname=id=>id&&group(id)?group(id).title:"未分组";
  let t=`# 小八架构拓扑 · Agent 读本\n生成时间：${stamp(Date.now())}　节点 ${G.nodes.length} · 连线 ${G.edges.length} · 分组 ${G.groups.length}\n\n`;
  t+=`## 读前须知\n- 本页是用户维护的小八架构设计底座。“用户意图”是用户想要的样子，代码与之不符时以用户意图为准并向用户报告差异，不自行改图。\n- 状态：已上线＝v1.6.4 生产已有；候选已开发＝v1.6.5 候选代码有、未上线；待实现＝设计有、代码无；旧执行链＝保留但不是新设计；待用户裁定＝有分歧，未定前不要实现。\n- 动手前先看“问题与待办”和“变更历史”，避免重做用户已删除或已改掉的东西。\n- “用户原话”是用户亲笔写的大白话，优先级最高；专业描述是 Agent 整理的，两者冲突时以原话为准。标“待整理”的节点，专业描述还没跟上用户最新原话。\n\n`;
  const pend=submissions.filter(s=>s.status!=="done");
  if(pend.length){t+=`## 待 Agent 整理的提交（${pend.length}）\n`;pend.forEach(s=>{t+=`### ${stamp(s.at)}\n`;(s.notes||[]).forEach(x=>t+=`- ${x.title}（${x.node}）原话：${x.text}\n`);(s.changes||[]).forEach(x=>t+=`- 期间改动：${x.text}\n`);});t+="\n";}
  G.groups.concat([{id:"",title:"未分组"}]).forEach(g=>{
    const ms=G.nodes.filter(n=>(n.g||"")===g.id);if(!ms.length&&!g.id)return;
    t+=`## ${g.title}\n`;
    ms.forEach(n=>{t+=`- 【${STATUS[n.status][0]}】${n.title}（${n.id}）${n.sub?"：“"+n.sub+"”":""}${n.pending?"　［待整理］":""}\n`;
      const said=(n.history||[]).filter(h=>h.by==="user");if(said.length)t+=`  - 用户原话（${stamp(said[said.length-1].at)}）：${said[said.length-1].text}\n`;
      if(n.note&&n.note.trim())t+=`  - 用户草稿（未提交）：${n.note.trim()}\n`;
      if(n.intent)t+=`  - 用户意图：${n.intent}\n`;if(n.desc)t+=`  - 说明：${n.desc}\n`;
      lines(n.refs).forEach(r=>t+=`  - 位置：${r}\n`);lines(n.issues).forEach(r=>t+=`  - 问题/待办：${r}\n`);});
    t+="\n";
  });
  t+=`## 连线（起点 → 终点）\n`;G.edges.forEach(e=>{t+=`- ${nameOf(e.from)} → ${nameOf(e.to)}${e.label?"："+e.label:""}${e.kind!=="normal"?"［"+KINDS[e.kind]+"］":""}\n`;});
  t+=`\n## 变更历史（按日期，新→旧）\n`;let lastD="";logs.slice(0,200).forEach(l=>{const d=l.day||dayOf(l.at);if(d!==lastD){t+=`### ${d}\n`;lastD=d;}t+=`- ${clock(l.at)} ［${(OPS[l.op]||OPS.edit)[0]}］${l.text}\n`;});if(!logs.length)t+="- 暂无\n";
  return t;
}
function panelReader(){
  const txt=readerText();
  pbody.innerHTML=`<div class="eyebrow">Agent 读本</div><h3>给所有接入 Agent 的文字版</h3>
  <p class="note">内容随图实时生成。Claude 能直接读到云端数据；其它 Agent（Codex、DSH、AGY…）请把下面的文字或 JSON 交给它，或让 Claude 同步到仓库文件。</p>
  <div class="btns"><button class="btn" type="button" id="cpTxt">复制读本</button><button class="btn" type="button" id="cpJson">复制 JSON</button>${downloads?'<button class="btn" type="button" id="dlJson">下载 JSON</button>':""}</div>
  <pre class="reader" id="readerPre"></pre>
  <h4>导入</h4><label>粘贴之前导出的 JSON，整体替换当前拓扑（可撤销）<textarea id="impTxt" class="mono" placeholder='{"version":1,"groups":[...],"nodes":[...],"edges":[...]}'></textarea></label>
  <div class="btns"><button class="btn" type="button" id="impBtn"${editable()?"":" disabled"}>替换为导入内容</button><button class="btn" type="button" id="baseBtn"${editable()?"":" disabled"}>恢复成 10-27 设计图基线</button></div><div id="impMsg" class="note"></div>`;
  $("#readerPre").textContent=txt;
  const copy=(s,btn)=>{const done=()=>{btn.textContent="已复制";setTimeout(()=>renderPanel(),1400);};
    try{navigator.clipboard.writeText(s).then(done,()=>selectPre());}catch(_){selectPre();}};
  const selectPre=()=>{const r=document.createRange();r.selectNodeContents($("#readerPre"));const s=getSelection();s.removeAllRanges();s.addRange(r);$("#impMsg").textContent="浏览器不允许自动复制，已选中读本，请手动复制。";};
  $("#cpTxt").onclick=e=>copy(txt,e.target);$("#cpJson").onclick=e=>copy(JSON.stringify(G,null,1),e.target);
  if(downloads)$("#dlJson").onclick=()=>downloads.save({filename:"小八架构拓扑-"+stamp(Date.now()).replace(/[: ]/g,"")+".json",data:JSON.stringify(G,null,1)}).catch(()=>{});
  $("#impBtn").onclick=()=>{try{const d=JSON.parse($("#impTxt").value);if(!Array.isArray(d.nodes)||!Array.isArray(d.edges)||!Array.isArray(d.groups))throw 0;
      const before={nodes:G.nodes.length,edges:G.edges.length};commit(()=>{G=normalize({version:1,groups:d.groups,nodes:d.nodes,edges:d.edges,lastSubmitAt:d.lastSubmitAt||0});sel=null;},{op:"edit",text:`导入 JSON 整体替换（原 ${before.nodes} 节点 / ${before.edges} 连线 → ${d.nodes.length} / ${d.edges.length}）`,before:null});fit();}
    catch(_){$("#impMsg").textContent="不是有效的拓扑 JSON：需要 groups、nodes、edges 三个数组。";}};
  $("#baseBtn").onclick=e=>{if(e.target.dataset.armed){commit(()=>{G=clone(BASE);sel=null;},{op:"edit",text:"整体恢复为 2026-10-27 设计图基线（可撤销）"});fit();}else{e.target.dataset.armed="1";e.target.textContent="再点一次确认恢复";e.target.classList.add("armed");}};
}

/* ---------- 启动与存储 ---------- */
applyView();render();requestAnimationFrame(()=>fit());
(async function boot(){
  let db=null;
  try{if(window.claude&&typeof window.claude.use==="function"){db=await window.claude.use("db");downloads=await window.claude.use("downloads");}}catch(_){db=null;}
  if(!db){
    mode="local";
    try{const s=localStorage.getItem("xb-topology-v1");if(s){const d=JSON.parse(s);if(d&&Array.isArray(d.nodes))G=normalize(d);}const l=localStorage.getItem("xb-topology-log");if(l)logs=JSON.parse(l)||[];const sb=localStorage.getItem("xb-topology-subs");if(sb)submissions=JSON.parse(sb)||[];}catch(_){}
    setSave("warn","只存在本浏览器");render();fit();return;
  }
  docRef=db.doc("topology/main");logCol=db.collection("changes");subCol=db.collection("submissions");
  subCol.orderBy("at","desc").limit(200).onSnapshot(qs=>{submissions=qs.docs.map(x=>Object.assign({id:x.id},x.data()));if(tab==="submits"||tab==="reader")renderPanel();},()=>{});
  let first=true;
  docRef.onSnapshot(snap=>{
    if(!snap.exists){if(first){first=false;mode="db";G=clone(BASE);setSave("busy","云端还是空的");
        const b=$("#banner");b.innerHTML="云端还没有保存的拓扑，现在显示的是 10-27 设计图基线。第一次修改时会整体保存。";b.hidden=false;mode="db-empty";
        setTimeout(()=>{mode="db";},0);render();fit();}return;}
    const d=snap.data();if(snap.metadata.hasPendingWrites)return;
    // Snapshot bodies are frozen: normalize a copy, never the delivered data.
    const body=JSON.stringify(normalize(clone({version:d.version||1,groups:d.groups||[],nodes:d.nodes||[],edges:d.edges||[],lastSubmitAt:d.lastSubmitAt||0})));
    if(!first&&(drag||saving||saveT&&$("#saveState").classList.contains("busy")))return;
    if(body===lastSaved&&!first)return;
    const typing=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&pbody.contains(document.activeElement);
    G=JSON.parse(body);lastSaved=body;fixSel();mode="db";
    if(typing&&!first){render(true);setSave("ok","已同步他处的更新");return;}
    if(first){first=false;render();fit();}else{render();}
    setSave("ok",d.savedAt?"已保存 "+clock(d.savedAt):"已连接");$("#banner").hidden=true;
  },err=>{setSave("warn","云端连接中断（"+(err&&err.code||"未知")+"），修改暂存本页");});
  logCol.orderBy("at","desc").limit(1000).onSnapshot(qs=>{logs=qs.docs.map(x=>Object.assign({id:x.id},x.data()));if(tab!=="inspect"||!(document.activeElement&&pbody.contains(document.activeElement)))renderPanel();renderBoard();updateButtons();},()=>{});
})();
window.addEventListener("resize",()=>{refreshGeometry();});
})();
</script>
