<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8fc">
  <meta name="description" content="小八 AgentOS 现行架构：53 节点、85 连线；线上 v1.6.11，云端图谱 1645；评分中心与复用计分已上线。">
  <title>小八 AgentOS · 架构拓扑</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./editor.css">
  <script src="./data.js" defer></script>
  <script src="./app.js" defer></script>
  <script src="./editor.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="heading"><div class="brand-mark" aria-hidden="true">八</div><div><h1>小八 AgentOS <span>架构拓扑</span></h1><p id="versionLine" class="version-line">线上 v1.6.11<br>2026-11-09 正式上线 · 发版已恢复</p></div></div>
    <div class="header-actions"><button id="statusToggle" class="quiet" aria-expanded="true" aria-controls="statusStrip">实现状态</button><button id="readingToggle" class="quiet" aria-pressed="false">阅读模式</button></div>
  </header>
  <div id="statusStrip" class="status-strip">
    <span id="sourceLine">依据：云端图谱 1645 · 2026-11-09 同步，53 节点 / 85 连线</span>
    <span>已上线：评分中心、正式经验复用计分、按角色与周评分择优</span>
    <span>待实现：共用工作日台账＋每日台账索引总目录；v1.6.8 未单独上线，改动并入 v1.6.9</span>
    <span>升级发布 8 节点、评分细分 5 节点独立保留，待用户定</span>
  </div>
  <nav id="viewTabs" class="tabs" aria-label="架构视图" role="tablist"></nav>
  <section class="toolbar" aria-label="拓扑控制">
    <div class="view-title"><h2 id="viewTitle"></h2><p id="viewSubtitle"></p></div>
    <div class="controls">
      <div class="search-wrap"><label class="sr-only" for="search">搜索节点</label><input id="search" type="search" placeholder="搜索节点或规则…" autocomplete="off"><div id="searchResults" class="search-results" hidden></div></div>
      <div class="zoom-controls"><button id="zoomOut" aria-label="缩小">−</button><output id="zoomLevel" aria-live="polite">100%</output><button id="zoomIn" aria-label="放大">＋</button><button id="fit" title="显示完整拓扑">适应</button><button id="actual" title="恢复原始字号">1:1</button></div>
    </div>
  </section>
  <main id="workspace" class="workspace">
    <div id="viewport" class="viewport" tabindex="0" aria-label="架构画布，可拖动或缩放">
      <div id="world" class="world"><canvas id="wires" aria-hidden="true"></canvas><div id="groups"></div><div id="nodes"></div></div>
      <div id="emptyMessage" class="empty-message" hidden></div>
    </div>
    <section id="readingView" class="reading-view" aria-label="架构阅读模式" hidden></section>
    <aside id="detail" class="detail" aria-label="节点详情" hidden>
      <div class="detail-top"><span id="detailEyebrow"></span><button id="closeDetail" aria-label="关闭详情">×</button></div>
      <h2 id="detailTitle"></h2><div id="detailStatus"></div><p id="detailDescription"></p><div id="detailSections"></div><div id="detailLinks"></div>
    </aside>
  </main>
  <footer><div class="legend"><span><i class="dot current"></i><span id="liveLegend">已上线（v1.6.11 基础能力）</span></span><span><i class="dot developed"></i>候选已开发</span><span><i class="dot planned"></i>待实现</span><span><i class="dot pending"></i>待用户裁定 / 待用户定</span></div><span id="hint">拖动画布 · 滚轮缩放 · 点击节点查看规则</span></footer>
  <div id="announcement" class="sr-only" aria-live="polite"></div>
</body>
</html>
