<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="xiaoba-page-token" content="__TOKEN__"><title>小八运行监看 · 开放审查</title><style>
:root{font:15px/1.65 system-ui,sans-serif;color:#e6edf5;background:#10151d;color-scheme:dark}body{max-width:1200px;margin:auto;padding:24px}h1{font-size:25px;margin-bottom:5px}h2{font-size:19px}p{margin-top:4px;color:#a7b5c9}section,details{border:1px solid #334154;border-radius:12px;padding:18px;margin:18px 0;background:#17202b}label{display:block;margin:10px 0}input,textarea,select,button{font:inherit;border:1px solid #48586d;border-radius:6px;padding:8px;background:#101823;color:inherit;box-sizing:border-box}input,textarea,select{width:100%}textarea{min-height:80px}button{cursor:pointer;margin:5px 7px 5px 0;background:#243a50}button:disabled{opacity:.5;cursor:default}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.status{padding:7px 11px;border-radius:6px;background:#25344a}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}#message{white-space:pre-wrap;color:#ffcf89;min-height:1.7em}a{color:#8fccff}.receipt{border-top:1px solid #405168;padding-top:10px}small{color:#a7b5c9}summary{cursor:pointer}@media(max-width:700px){.grid{grid-template-columns:1fr}body{padding:12px}}.verdict{font-weight:bold}
</style><script src="/open-review.js" defer></script></head><body>
<header><a href="/">小八运行监看</a><h1>DSH ＋ 开放第二审查</h1><p>身份任务卡 → 独立审查回执 → 来源核对 → 裁决材料中心 → 原卡人工裁决</p><div id="connection" class="status" role="status">正在连接</div><div id="message" role="alert"></div></header>
<details><summary>登记审查来源</summary><p>由本地操作者依据实际身份与交接来源登记。同一来源的别名不能算成两票。</p><form id="sourceForm"><div class="grid"><label>身份 ID<input name="reviewer_id" required></label><label>来源类型<select name="kind"><option value="peer">第二审查 Agent</option><option value="dsh">固定 DSH</option></select></label><label>实际来源标识<input name="source_ref" required></label><label>来源依据<input name="provenance" placeholder="客户端身份记录或交接来源，不填写密钥" required></label></div><button>保存来源</button></form></details>
<section><h2>为原经验卡发起审查</h2><form id="requestForm"><label>原经验卡 ID<input name="candidate_id" required></label><div class="grid"><label>固定 DSH<select name="dsh_id" id="dshSelect" required></select></label><label>第二审查 Agent<select name="peer_id" id="peerSelect" required></select></label><label>DSH 接入方式<select name="dsh_channel"><option value="external_handoff">导出卡片，由用户交接</option><option value="backend_adapter">已登记后台适配器</option></select></label><label>第二方接入方式<select name="peer_channel"><option value="external_handoff">外部 Agent 文件回执</option><option value="backend_adapter">已登记后台适配器</option></select></label></div><label>审查范围<textarea name="scope" required></textarea></label><label>证据引用 JSON 数组<textarea name="evidence" required placeholder='[{"ref":"任务或产物版本","sha256":"实际证据摘要"}]'></textarea></label><button>生成两份身份任务卡</button></form></section>
<section><h2>回执接入口</h2><p>回执先核对任务和版本；自填身份不会自动获得认证。后台适配器与外部文件使用同一入口。</p><label>导入回执 JSON 文件<input id="receiptFile" type="file" accept=".json,application/json"></label><label>或粘贴结构化回执<textarea id="receiptBody"></textarea></label><button id="importReceipt">接收回执</button><button id="retry">重试待投递材料</button></section>
<h2>运行状态与任务卡</h2><div id="requests"></div>
<section><h2>裁决材料中心</h2><p>两份有效回执齐备即可进入，包括 FAIL 和分歧。这里只归集材料，不批准经验；方法验证和原人工终审门禁继续生效。</p><div id="decisions"></div></section>
</body></html>
