<!-- Fragment mounted in the existing monitor; there is no separate pool page. -->
<div id="apScrim" class="ap-scrim" hidden></div>
<aside id="apDrawer" class="ap-drawer" data-page-token="__TOKEN__" hidden role="dialog" aria-modal="true" aria-labelledby="apTitle">
  <div class="ap-head"><div><span class="ap-eyebrow">后台 Agent · 节点设置</span><h2 id="apTitle">添加节点</h2></div><button id="apClose" type="button" aria-label="关闭 Agent 节点设置">×</button></div>
  <p id="apConnection" class="ap-note" role="status">正在连接本机节点…</p><p id="apMessage" class="ap-message" role="alert"></p>
  <form id="apForm" hidden>
    <label>Agent 名称 · 自定义<input name="name" placeholder="填写你给这个 Agent 起的名字" required maxlength="80"></label>
    <label>任务槽位<select name="kind"><option value="peer">审查槽位 B</option><option value="dsh">审查槽位 A（兼容旧 DSH 槽位）</option></select></label>
    <label>调用方式<select name="interface"><option value="cli">CLI</option><option value="desktop">桌面端</option><option value="web">Web</option></select></label>
    <label>调用入口<input name="entry" placeholder="程序绝对路径、应用入口或网页地址" required maxlength="2048"></label>
    <label>模型<input name="model" placeholder="填写你已选定的模型" required maxlength="200"></label>
    <p class="ap-note">名称、调用方式、入口和模型均由你指定，也可通过与小八对话补齐。新节点先关闭；开启并测试通过后，小八直接使用适用节点，不重复问这些资料。AGY CLI 使用脚本＋持续交互 PTY，可在节点内查看只读终端；其他 CLI、桌面或 Web 需要对应受信调用器。</p><button type="submit" class="ap-primary ap-wide">添加节点</button>
  </form>
  <section id="apDetail" hidden></section><section id="apManage" hidden></section>
  <p class="ap-scope">资料缺失时小八只补问缺项；已开启且当前入口与模型测试通过时直接调用。关闭、移除、入口变化或执行失败会阻止继续直跑。当前覆盖开放审查链，旧 Worker 后台名单仍按原配置；技术测试不批准经验。</p>
</aside>
